plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.compose)
    id 'maven-publish'
}

android {
    namespace 'com.kit.video'
    compileSdk = 37

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.e-hai.VideoKit-Android'
                artifactId = 'video'
                version = project.version != 'unspecified' ? project.version : '1.0.0'
            }
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.recyclerview
    implementation libs.androidx.paging.runtime.ktx

    // 使用 ExoPlayer 进行媒体播放
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.exoplayer.hls
    implementation libs.androidx.media3.exoplayer.dash
    // 使用 OkHttp 网络栈加载数据
    implementation libs.androidx.media3.datasource.okhttp
    // 构建媒体播放界面
    implementation libs.androidx.media3.ui.lib
    // 暴露和控制媒体会话
    implementation libs.androidx.media3.session
    // 从媒体容器中提取数据
    implementation libs.androidx.media3.extractor
    // 使用 Jetpack WorkManager 的 WorkManager 调度后台操作
    implementation libs.androidx.media3.exoplayer.workmanager
    // 转换媒体文件
    implementation libs.androidx.media3.transformer
    // 测试媒体组件的工具（包括 ExoPlayer 组件）
//    implementation libs.androidx.media3.test.utils
    // 使用 Robolectric 测试媒体组件的工具
//    implementation libs.androidx.media3.test.utils.robolectric
    // 媒体数据库组件的通用功能
    implementation libs.androidx.media3.database
    // 媒体解码器的通用功能
    implementation libs.androidx.media3.decoder
    // 加载数据的通用功能
    implementation libs.androidx.media3.datasource
    // 多个媒体库中通用的功能
    implementation libs.androidx.media3.common
    
    // Compose dependencies
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material3.icons.core
    implementation libs.androidx.compose.material3.icons.extended
    implementation libs.androidx.compose.lifecycle
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}