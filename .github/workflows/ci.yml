name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK and accept licenses
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            ANDROID_HOME="/usr/local/lib/android/sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build all modules (video, video-ffmpeg, sample)
        run: ./gradlew :video:assembleDebug :video-ffmpeg:assembleDebug :sample:assembleDebug --no-daemon --stacktrace

      - name: Verify release Maven publication locally
        run: >
          ./gradlew :video:publishReleasePublicationToMavenLocal
          :video-ffmpeg:publishReleasePublicationToMavenLocal
          -PVERSION_NAME=0.0.0-ci
          --no-daemon --stacktrace

      - name: Verify published AAR and POM artifacts
        run: |
          BASE="$HOME/.m2/repository/com/github/e-hai"
          for artifact in video video-ffmpeg; do
            test -f "$BASE/$artifact/0.0.0-ci/$artifact-0.0.0-ci.aar" || (echo "Missing $artifact AAR" && exit 1)
            test -f "$BASE/$artifact/0.0.0-ci/$artifact-0.0.0-ci.pom" || (echo "Missing $artifact POM" && exit 1)
            test -f "$BASE/$artifact/0.0.0-ci/$artifact-0.0.0-ci-sources.jar" || (echo "Missing $artifact sources JAR" && exit 1)
          done
          echo "All GitHub Packages artifacts verified."
